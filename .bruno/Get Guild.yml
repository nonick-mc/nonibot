info:
  name: Get Guild
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/guilds/:guildId"
  params:
    - name: guildId
      value: "{{guild_id}}"
      type: path
  auth:
    type: bearer
    token: "{{secret}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
