info:
  name: Get Member
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/guilds/:guildId/members/:userId"
  params:
    - name: guildId
      value: "{{guild_id}}"
      type: path
    - name: userId
      value: "{{user_id}}"
      type: path
  auth:
    type: bearer
    token: "{{secret}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
